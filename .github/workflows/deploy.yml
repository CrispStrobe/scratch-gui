name: Deploy
on:
  push:
    branches:
      - lego-bluetooth-extensions
    tags:
      - "!*"
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          repository: CrispStrobe/scratch-gui
          ref: lego-bluetooth-extensions
          path: ./scratch-gui
      
      - uses: actions/setup-node@v4.0.2
        with:
          node-version-file: ./scratch-gui/.nvmrc
          cache: npm
          cache-dependency-path: ./scratch-gui/package-lock.json
      
      - run: npm ci
        working-directory: ./scratch-gui
      
      - run: npm run build
        working-directory: ./scratch-gui
      
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./scratch-gui/build